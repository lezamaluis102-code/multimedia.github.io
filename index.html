<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Pitch & Speed Changer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="range"], input[type="file"] {
      width: 100%;
      box-sizing: border-box;
    }
    span.value-display {
      display: inline-block;
      font-weight: bold;
      margin-top: 5px;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>Audio Manipulator</h2>

  <div class="control-group">
    <label for="audioFile">Select Audio File:</label>
    <input type="file" id="audioFile" accept="audio/*">
  </div>

  <div class="control-group">
    <label for="speedSlider">Speed (Playback Rate): <span id="speedValue" class="value-display">1.0x</span></label>
    <input type="range" id="speedSlider" min="0.3" max="3.2" step="0.1" value="1">
  </div>

  <div class="control-group">
    <label for="pitchToggle">Link Pitch to Speed?</label>
    <input type="checkbox" id="pitchToggle" checked>
    <small style="display:block; color:#666;">(Uncheck to change speed without altering pitch)</small>
  </div>

  <div class="control-group">
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    const fileInput = document.getElementById('audioFile');
    const audioPlayer = document.getElementById('audioPlayer');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const pitchToggle = document.getElementById('pitchToggle');

    // Load selected file into audio player
    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        audioPlayer.src = fileURL;
        audioPlayer.play();
      }
    });

    // Adjust playback speed
    speedSlider.addEventListener('input', function() {
      const speed = parseFloat(this.value);
      audioPlayer.playbackRate = speed;
      speedValue.textContent = speed.toFixed(1) + 'x';
    });

    // Toggle pitch preservation
    pitchToggle.addEventListener('change', function() {
      // When false, pitch changes dynamically with speed
      // When true, browser tries to preserve original pitch
      audioPlayer.preservesPitch = this.checked;
    });
  </script>

</body>
</html>
